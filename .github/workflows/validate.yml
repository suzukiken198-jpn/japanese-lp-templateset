name: Validate templates
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run validate
      - run: npm run setup
      - run: npm run build:all
      - run: npm run build:site
      - run: npm run test:site
